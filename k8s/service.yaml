apiVersion: v1
kind: Service
metadata:
  name: m324-chat
  namespace: m324
  labels:
    app: m324-chat
spec:
  type: NodePort
  selector:
    app: m324-chat
  ports:
    - name: http
      port: 80
      targetPort: 3000
      # On Docker Desktop Kubernetes the NodePort is reachable at localhost:30080
      nodePort: 30080
