name: CI

# Runs on every pull request and on pushes to development / feature branches.
# Any failing step (lint, test, build or docker build) interrupts the pipeline.
on:
  pull_request:
  push:
    branches:
      - development
      - 'feature/**'

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The Docker image build re-runs lint, test and build inside its build
      # stage, so the pipeline steps also execute within the image build.
      - name: Build Docker image
        run: docker build -t m324-chat:ci-${{ github.sha }} .
