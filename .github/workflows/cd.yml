name: CD

# Runs when code is merged into master (e.g. via a pull request). Builds and
# pushes the image to Docker Hub and deploys it to the local Kubernetes cluster.
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/m324-chat
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and tag image
        run: docker build -t "$IMAGE_NAME:${{ github.sha }}" -t "$IMAGE_NAME:latest" .

      - name: Push image to Docker Hub
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

      - name: Deploy to Kubernetes
        run: IMAGE="$IMAGE_NAME:${{ github.sha }}" ./k8s/deploy.sh
